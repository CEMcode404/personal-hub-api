AWSTemplateFormatVersion: "2010-09-09"
Description: Personal Hub WAF + Certificate - Must be deployed in us-east-1

Resources:
  HubWafWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: personal-hub-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
        - Name: RateLimitRule
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRule

        - Name: AWSManagedRulesCommonRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSet

        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesKnownBadInputsRuleSet

      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: PersonalHubWAF

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: cmjrlabs.com
      SubjectAlternativeNames:
        - admin.cmjrlabs.com
        - "*.cmjrlabs.com"
      ValidationMethod: DNS

Outputs:
  WafWebAclArn:
    Description: WAF Web ACL ARN to use in CloudFront
    Value: !GetAtt HubWafWebAcl.Arn
  CertificateArn:
    Description: ACM Certificate ARN for CloudFront
    Value: !Ref Certificate
