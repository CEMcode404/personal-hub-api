AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Personal Hub API

Parameters:
  NotifyPhoneNumber:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /personal-hub/notify-phone-number
  AllowedOrigin:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /personal-hub/allowed-origin
  OriginSecret:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /personal-hub/origin-secret

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DYNAMODB_ENDPOINT_URL: ""
        APP_ENV: ""
        NOTIFY_PHONE_NUMBER: ""
        WEBSOCKET_ENDPOINT: ""
        CONNECTIONS_TABLE: ""
        NOTIFICATION_FUNCTION_ARN: ""
        SCHEDULER_ROLE_ARN: ""
        ALLOWED_ORIGIN: ""

Resources:
  # API Gateway
  HubApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10 # Adjust when going to release for production. This config is for dev phase only.
        ThrottlingRateLimit: 5
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
              audience:
                - !Ref CognitoUserPoolClient
          # CloudFront secret header authorizer
          CloudFrontAuthorizer:
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            FunctionArn: !GetAtt CloudFrontAuthorizerFunction.Arn
            EnableFunctionDefaultPermissions: true
            Identity:
              Headers:
                - x-origin-secret

  ApiGatewayUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /personal-hub/api-gateway-url
      Type: String
      Value: !Sub https://${HubApi}.execute-api.${AWS::Region}.amazonaws.com

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: personal-hub-user-pool
      MfaConfiguration: "ON"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: personal-hub-client
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # CloudFront Origin Secret Authorizer
  CloudFrontAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
    Properties:
      FunctionName: personal-hub-cloudfront-authorizer
      Handler: src.handlers.authorizer.handler
      CodeUri: .
      Environment:
        Variables:
          ORIGIN_SECRET: !Ref OriginSecret
          APP_ENV: ""
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/personal-hub/origin-secret

  # Lambda Function
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
    Properties:
      FunctionName: personal-hub-content
      Handler: src.main.handler
      Environment:
        Variables:
          NOTIFICATION_FUNCTION_ARN: !GetAtt NotificationFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ResearchTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WikiTable
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
              Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/todo-*
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn

      Events:
        # Content endpoints (public) - CloudFront secret header only
        ListContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content
            Method: GET
            Auth:
              Authorizer: CloudFrontAuthorizer

        GetContentBySlug:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content/slug/{slug}
            Method: GET
            Auth:
              Authorizer: CloudFrontAuthorizer

        # Content endpoints (admin) - Cognito
        ListAdminContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /admin/content
            Method: GET
        GetAdminContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /admin/content/{id}
            Method: GET
        CreateContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /admin/content
            Method: POST
        UpdateContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /admin/content/{id}
            Method: PATCH
        DeleteContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /admin/content/{id}
            Method: DELETE

        # Docs endpoint
        Docs:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /docs
            Method: GET

        # Research endpoints
        ListResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research
            Method: GET
        GetResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research/{id}
            Method: GET
        CreateResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research
            Method: POST
        UpdateResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research/{id}
            Method: PATCH
        DeleteResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research/{id}
            Method: DELETE

        # Todo endpoints
        ListTodos:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo
            Method: GET
        GetTodo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo/{id}
            Method: GET
        CreateTodo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo
            Method: POST
        UpdateTodo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo/{id}
            Method: PATCH
        DeleteTodo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo/{id}
            Method: DELETE

        # Notification endpoints
        ListNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /notifications
            Method: GET
        ListUnreadNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /notifications/unread
            Method: GET
        MarkNotificationRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /notifications/{id}/read
            Method: PATCH

        # Wiki endpoints
        ListWiki:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /wiki
            Method: GET
        GetWiki:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /wiki/{id}
            Method: GET
        CreateWiki:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /wiki
            Method: POST
        UpdateWiki:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /wiki/{id}
            Method: PATCH
        DeleteWiki:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /wiki/{id}
            Method: DELETE

  NotificationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
    Properties:
      FunctionName: personal-hub-notification
      Handler: src.handlers.eventbridge.handler
      Environment:
        Variables:
          NOTIFY_PHONE_NUMBER: !Ref NotifyPhoneNumber
          WEBSOCKET_ENDPOINT: !Sub https://${HubWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/$default
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - SNSPublishMessagePolicy:
            TopicName: "*"
        - Statement:
            - Effect: Allow
              Action:
                - "mobiletargeting:SendMessages"
                - "sns:Publish"
              Resource: "*"

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: personal-hub-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NotificationFunction.Arn

  # WebSocket Gateway
  HubWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: personal-hub-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HubWebSocketApi
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketAuthFunction.Arn}/invocations
      IdentitySource:
        - route.request.querystring.token
      Name: WebSocketAuthorizer

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HubWebSocketApi
      RouteKey: $connect
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WebSocketAuthorizer
      Target: !Sub integrations/${ConnectIntegration}

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HubWebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${DisconnectIntegration}

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HubWebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub integrations/${DefaultIntegration}

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HubWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HubWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HubWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HubWebSocketApi
      StageName: $default
      AutoDeploy: true

  WebSocketFunctionPermissionConnect:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HubWebSocketApi}/*/*

  WebSocketFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
    Properties:
      FunctionName: personal-hub-websocket
      Handler: src.handlers.websocket.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HubWebSocketApi}/*

  WebSocketAuthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
    Properties:
      FunctionName: personal-hub-websocket-auth
      Handler: src.handlers.websocket.authorizer
      CodeUri: .
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: "*"

  WebSocketAuthFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketAuthFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HubWebSocketApi}/*/*

  # DynamoDB
  ContentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-content
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsi_constant
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: gsi_status_sk
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi_ordering
          KeySchema:
            - AttributeName: gsi_constant
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - title
              - slug
              - status
              - type
              - tags
              - cover_image
              - excerpt
        - IndexName: gsi_by_status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: gsi_status_sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - title
              - slug
              - type
              - tags
              - cover_image
              - excerpt
              - published_at
              - updated_at
        - IndexName: gsi_by_slug
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ResearchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-research
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsi_constant
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi_ordering
          KeySchema:
            - AttributeName: gsi_constant
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - title
              - category
              - status
              - tags
        - IndexName: gsi_by_category
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - title
              - status
              - tags
        - IndexName: gsi_by_status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - title
              - category
              - tags

  TodosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-todos
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: recurring_parent_id
          AttributeType: S
        - AttributeName: gsi_order_sk
          AttributeType: S
        - AttributeName: status_sk
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi_by_parent
          KeySchema:
            - AttributeName: recurring_parent_id
              KeyType: HASH
            - AttributeName: gsi_order_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi_by_parent_status
          KeySchema:
            - AttributeName: recurring_parent_id
              KeyType: HASH
            - AttributeName: status_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WikiTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-wiki
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsi_constant
          AttributeType: S
        - AttributeName: gsi_order_sk
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi_ordering
          KeySchema:
            - AttributeName: gsi_constant
              KeyType: HASH
            - AttributeName: gsi_order_sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - title
              - category
              - tags
              - is_pinned
              - updated_at
              - cover_image
        - IndexName: gsi_by_category
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: gsi_order_sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - title
              - tags
              - is_pinned
              - cover_image
              - updated_at

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-notifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ApiEndpoint:
    Description: API endpoint
    Value: !Sub https://${HubApi}.execute-api.${AWS::Region}.amazonaws.com
  WebSocketEndpoint:
    Description: WebSocket endpoint
    Value: !Sub wss://${HubWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/$default
  NotificationFunctionArn:
    Description: Notification function ARN
    Value: !GetAtt NotificationFunction.Arn
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Description: Cognito Client ID
    Value: !Ref CognitoUserPoolClient
