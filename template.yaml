AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Personal Hub API

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DYNAMODB_ENDPOINT_URL: ""
        APP_ENV: ""

Resources:
  # API Gateway
  HubApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  # Lambda Function
  ContentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
    Properties:
      FunctionName: personal-hub-content
      Handler: src.main.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContentTable
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content/health
            Method: GET
        ListContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content
            Method: GET
        CreateContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content
            Method: POST
        UpdateContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content/{id}
            Method: PATCH
        Docs:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /docs
            Method: GET

  # DynamoDB
  ContentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-content
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  ApiEndpoint:
    Description: API endpoint
    Value: !Sub https://${HubApi}.execute-api.${AWS::Region}.amazonaws.com
