AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Personal Hub API

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DYNAMODB_ENDPOINT_URL: ""
        APP_ENV: ""
        NOTIFY_PHONE_NUMBER: ""
        WEBSOCKET_ENDPOINT: ""
        CONNECTIONS_TABLE: ""
        NOTIFICATION_FUNCTION_ARN: ""
        SCHEDULER_ROLE_ARN: ""

Resources:
  # API Gateway
  HubApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  # Lambda Function
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
    Properties:
      FunctionName: personal-hub-content
      Handler: src.main.handler
      Environment:
        Variables:
          NOTIFICATION_FUNCTION_ARN: !GetAtt NotificationFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ResearchTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationsTable

      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content/health
            Method: GET
        # Content endpoints
        ListContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content
            Method: GET
        GetContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content/{id}
            Method: GET
        CreateContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content
            Method: POST
        UpdateContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content/{id}
            Method: PATCH
        DeleteContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /content/{id}
            Method: DELETE
        # Docs endpoint
        Docs:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /docs
            Method: GET
        # Research endpoints
        ListResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research
            Method: GET
        GetResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research/{id}
            Method: GET
        CreateResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research
            Method: POST
        UpdateResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research/{id}
            Method: PATCH
        DeleteResearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /research/{id}
            Method: DELETE
        # Todo endpoints
        ListTodos:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo
            Method: GET
        GetTodo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo/{id}
            Method: GET
        CreateTodo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo
            Method: POST
        UpdateTodo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo/{id}
            Method: PATCH
        DeleteTodo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /todo/{id}
            Method: DELETE
        # Notification endpoints
        ListNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /notifications
            Method: GET
        ListUnreadNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /notifications/unread
            Method: GET
        MarkNotificationRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubApi
            Path: /notifications/{id}/read
            Method: PATCH

  NotificationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
    Properties:
      FunctionName: personal-hub-notification
      Handler: src.handlers.eventbridge.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - SNSPublishMessagePolicy:
            TopicName: "*"
        - Statement:
            - Effect: Allow
              Action:
                - "mobiletargeting:SendMessages"
                - "sns:Publish"
              Resource: "*"

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: personal-hub-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NotificationFunction.Arn

  # DynamoDB
  ContentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-content
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ResearchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-research
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  TodosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-todos
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: personal-hub-notifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ApiEndpoint:
    Description: API endpoint
    Value: !Sub https://${HubApi}.execute-api.${AWS::Region}.amazonaws.com
  NotificationFunctionArn:
    Description: Notification function ARN
    Value: !GetAtt NotificationFunction.Arn
